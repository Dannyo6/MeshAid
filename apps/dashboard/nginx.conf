# ==============================================================================
# MeshAid Incident Dashboard - Nginx Reverse Proxy Configuration
# Serves Vite SPA on ports 80/5173 and routes /api & /ws to backend:3000
# ==============================================================================

map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}

server {
    listen 80;
    listen 5173;
    server_name localhost;

    # Docker internal DNS resolver with dynamic runtime query to prevent startup failure
    resolver 127.0.0.11 valid=5s ipv6=off;
    set $backend_origin "http://backend:3000";

    root /usr/share/nginx/html;
    index index.html index.htm;

    # Production asset compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied expired no-cache no-store private auth;
    gzip_types text/plain text/css text/xml text/javascript application/javascript application/x-javascript application/json application/xml;

    # SPA routing fallback to index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Reverse proxy: /api -> backend:3000/api
    location /api/ {
        proxy_pass $backend_origin/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Reverse proxy: /ws -> backend:3000
    location /ws {
        proxy_pass $backend_origin;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    # Zero-downtime healthcheck endpoint
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "healthy\n";
    }
}
