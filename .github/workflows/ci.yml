name: MeshAid CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  documentation-verification:
    name: Documentation Verification
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Verify Architecture & Protocol Documentation
        run: |
          echo "Verifying presence and integrity of core documentation..."
          REQUIRED_DOCS=(
            "README.md"
            "CONTRIBUTING.md"
            "SECURITY.md"
            "LICENSE"
            "docs/ARCHITECTURE.md"
            "docs/ARCHITECTURE_DECISION.md"
            "docs/DEVELOPMENT_PLAN.md"
            "docs/MESSAGE_PROTOCOL.md"
            "docs/MVP.md"
            "docs/PROJECT_OVERVIEW.md"
            "docs/SECURITY_DESIGN.md"
            "docs/TECHNICAL_RESEARCH.md"
          )
          for doc in "${REQUIRED_DOCS[@]}"; do
            if [ ! -s "$doc" ]; then
              echo "::error::Required documentation file is missing or empty: $doc"
              exit 1
            fi
            echo "✔ $doc verified"
          done
          echo "All required documentation files verified successfully."

  protocol-tests:
    name: Protocol Engine & Relay Tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build Protocol Core
        working-directory: packages/protocol
        run: npm run build

      - name: Static Type Lint
        working-directory: packages/protocol
        run: npm run lint

      - name: Execute Protocol Unit & 3-Node Relay Tests
        working-directory: packages/protocol
        run: npm test

  service-build-checks:
    name: Service Build Checks (${{ matrix.target.name }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        target:
          - name: Backend Gateway Service
            path: services/backend
          - name: Incident Dashboard App
            path: apps/dashboard
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build Protocol Core Dependency
        working-directory: packages/protocol
        run: npm run build

      - name: Static Type Lint
        working-directory: ${{ matrix.target.path }}
        run: npm run lint

      - name: Build ${{ matrix.target.name }}
        working-directory: ${{ matrix.target.path }}
        run: npm run build
