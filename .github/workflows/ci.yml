name: MeshAid CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  documentation-verification:
    name: Documentation Verification
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Verify Architecture & Protocol Documentation
        run: |
          echo "Verifying presence and integrity of core documentation..."
          REQUIRED_DOCS=(
            "README.md"
            "CONTRIBUTING.md"
            "SECURITY.md"
            "LICENSE"
            "docs/ARCHITECTURE.md"
            "docs/ARCHITECTURE_DECISION.md"
            "docs/DEVELOPMENT_PLAN.md"
            "docs/MESSAGE_PROTOCOL.md"
            "docs/MVP.md"
            "docs/PROJECT_OVERVIEW.md"
            "docs/SECURITY_DESIGN.md"
            "docs/TECHNICAL_RESEARCH.md"
          )
          for doc in "${REQUIRED_DOCS[@]}"; do
            if [ ! -s "$doc" ]; then
              echo "::error::Required documentation file is missing or empty: $doc"
              exit 1
            fi
            echo "✔ $doc verified"
          done
          echo "All required documentation files verified successfully."

  android-ci:
    name: Android Build & Unit Tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Run Android Unit Tests
        run: ./gradlew testDebugUnitTest

      - name: Assemble Debug APK
        run: ./gradlew assembleDebug

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
