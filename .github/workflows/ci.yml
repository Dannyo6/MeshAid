name: MeshAid CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  protocol-and-simulation:
    name: Protocol Engine & 3-Node Relay Tests
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run TypeScript build & lint
        working-directory: packages/protocol
        run: npm run build

      - name: Execute Protocol Unit & 3-Node Relay Tests
        working-directory: packages/protocol
        run: npm test
